<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0e1116" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Children's Theatre of Charlotte — Hugh McColl Family Theatre (ImaginOn) 3D Set Design, Scenic Workshop &amp; Audience Sightline Modeler" />
  <title>Children's Theatre of Charlotte — 3D Set Design &amp; Sightline Modeler</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&amp;family=JetBrains+Mono:wght@500;600;700&amp;family=Luckiest+Guy&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;family=Space+Grotesk:wght@600;700&amp;display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <!-- Architectural Loading Screen Overlay -->
  <div id="loading-screen" class="loading-screen" role="status" aria-live="polite">
    <div class="loading-card">
      <div class="loading-eyebrow">CHILDREN'S THEATRE OF CHARLOTTE · IMAGINON (300 E. 7TH ST)</div>
      <h1 class="loading-title">Hugh McColl Family Theatre</h1>
      <p class="loading-subtitle">3D Scenic Set Design, Counterweight Fly Loft &amp; 533-Seat Sightline Modeler</p>

      <div class="loading-specs-row">
        <span class="loading-spec-pill">398 MAIN FLOOR</span>
        <span class="loading-spec-pill">135 BALCONY</span>
        <span class="loading-spec-pill">8 PRODUCTION SETS</span>
        <span class="loading-spec-pill">52 FLY LINESETS</span>
      </div>

      <div class="loading-progress-track">
        <div id="loading-progress-bar" class="loading-progress-bar" style="width: 12%"></div>
      </div>

      <div class="loading-status-row">
        <span id="loading-step-text" class="loading-step-text">Initializing WebGL2 HDR Pipeline &amp; Shader Light Culling...</span>
        <span id="loading-pct-text" class="loading-pct-text">12%</span>
      </div>
    </div>
  </div>

  <div id="app">
    <canvas id="three-canvas"></canvas>
    <div id="shell-root"></div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
